<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warm Flavors | Restaurant & Cafe</title>
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Hero Section Styling */
        .hero {
            position: relative;
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            /* Replace the URL below with your actual image path */
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                        url('https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
        }

        /* Content Box with Glass Effect */
        .hero-content {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 800px;
            margin: 0 20px;
        }

        .hero-content h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .hero-content p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            line-height: 1.6;
            color: #f0f0f0;
        }

        /* Buttons */
        .cta-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1rem;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-primary {
            background-color: #d4a373; /* Warm gold/tan color */
            color: #fff;
        }

        .btn-primary:hover {
            background-color: #bc8a5f;
            transform: translateY(-3px);
        }

        .btn-secondary {
            background-color: transparent;
            color: white;
            border: 2px solid white;
        }

        .btn-secondary:hover {
            background-color: white;
            color: #333;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .hero-content h1 { font-size: 2.5rem; }
            .cta-buttons { flex-direction: column; }
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="hero-content">
            <h1>Escape to Comfort</h1>
            <p>Experience the finest blend of artisanal coffee and gourmet dining in an atmosphere designed for relaxation. Your table is waiting.</p>
            <div class="cta-buttons">
                <a href="#" class="btn btn-primary">Book a Table</a>
                <a href="#" class="btn btn-secondary">View Menu</a>
            </div>
        </div>
    </section>

</body>
</html>
